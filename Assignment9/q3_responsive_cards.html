<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Q3 - Responsive Cards with Media Queries</title>
  <style>
    /* Q3: 4 cards responsive via media queries
       Desktop: 4 columns, Tablet: 2, Mobile:1 */
    *{box-sizing:border-box}
    body{font-family:Segoe UI,Arial;margin:0;background:#f7fbff;color:#071029;padding:1rem}
    .cards{display:flex;gap:1rem;flex-wrap:wrap}
    .card{flex:1 1 calc(25% - 1rem);background:#fff;padding:1rem;border-radius:8px;box-shadow:0 10px 30px rgba(2,6,23,0.06);transition:background 220ms,transform 220ms}
    .card:hover{background:linear-gradient(180deg,#fff,#eef6ff);transform:translateY(-6px)}
    .card h3{margin-top:0}

    /* Tablet: 2 columns */
    @media(max-width:900px){
      .card{flex:1 1 calc(50% - 1rem)}
    }
    /* Mobile: 1 column */
    @media(max-width:600px){
      .card{flex:1 1 100%}
    }
  </style>
</head>
<body>
  <main>
    <section class="cards">
      <article class="card"><h3>Card 1</h3><p>Content</p></article>
      <article class="card"><h3>Card 2</h3><p>Content</p></article>
      <article class="card"><h3>Card 3</h3><p>Content</p></article>
      <article class="card"><h3>Card 4</h3><p>Content</p></article>
    </section>
  </main>
</body>
</html>
