<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Photo Gallery (Grid)</title>
  <style>
    body{margin:0;font-family:Arial;background:#f7f9fc;padding:2rem}
    .gallery{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:1rem}
    figure{margin:0;position:relative;overflow:hidden;border-radius:8px}
    img{width:100%;height:100%;object-fit:cover;display:block;transition:transform 0.5s ease}
    figure:hover img{transform:scale(1.05)}
    figcaption{padding:0.6rem;background:rgba(0,0,0,0.6);color:#fff;position:relative;text-align:center}
  </style>
</head>
<body>
  <h1>Gallery</h1>
  <div class="gallery">
    <figure><img src="https://via.placeholder.com/400x300" alt=""><figcaption>Caption 1</figcaption></figure>
    <figure><img src="https://via.placeholder.com/400x300" alt=""><figcaption>Caption 2</figcaption></figure>
    <figure><img src="https://via.placeholder.com/400x300" alt=""><figcaption>Caption 3</figcaption></figure>
    <figure><img src="https://via.placeholder.com/400x300" alt=""><figcaption>Caption 4</figcaption></figure>
  </div>
</body>
</html>
