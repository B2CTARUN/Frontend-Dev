<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>About the City</title>
  <style>
    /* Multi-section page: full-width backgrounds, gradients, background-attachment fixed (parallax effect) */
    body{margin:0;font-family:Arial,Helvetica,sans-serif;color:#fff}
    header,nav,footer{text-align:center;padding:1rem}
    header{background:#0b3d91}
    nav{background:#123a6b}
    section{min-height:60vh;display:flex;align-items:center;justify-content:center;padding:4rem 2rem}
    .s1{background:url('https://via.placeholder.com/1200x600') center/cover fixed}
    .s2{background:linear-gradient(135deg,#ff7e5f,#feb47b)}
    .s3{background:radial-gradient(circle at 10% 20%,#43cea2,#185a9d)}
    .s4{background:url('https://via.placeholder.com/1200x800') center/cover fixed}
    h2{font-size:2rem;margin:0}
    .content{max-width:1000px;padding:1rem;background:rgba(0,0,0,0.35);border-radius:8px}
    footer{background:#071029}
  </style>
</head>
<body>
  <header><h1>My Favourite City</h1></header>
  <nav>Explore • Culture • Food</nav>
  <main>
    <section class="s1"><div class="content"><h2>Landmarks</h2></div></section>
    <section class="s2"><div class="content"><h2>Parks & Recreation</h2></div></section>
    <section class="s3"><div class="content"><h2>Local Cuisine</h2></div></section>
    <section class="s4"><div class="content"><h2>Festivals</h2></div></section>
  </main>
  <footer>© 2025 City Guide</footer>
</body>
</html>
