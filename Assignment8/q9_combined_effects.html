<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Combined Effects</title>
<style>
  /* Combine pseudo-classes, transitions and transforms on buttons; distribute using flexbox */
  body{margin:0;font-family:Arial;background:#f4f6f8;display:flex;align-items:center;justify-content:center;min-height:100vh}
  .row{display:flex;gap:1rem;flex-wrap:wrap}
  .btn{padding:0.6rem 1rem;border-radius:8px;border:0;cursor:pointer;transition:transform 0.18s ease,box-shadow 0.18s ease,background 0.18s}
  .btn:hover{transform:translateY(-6px);box-shadow:0 12px 24px rgba(2,6,23,0.12)}
  .btn:active{transform:translateY(-2px) scale(0.98)}
  .btn-primary{background:#0b63d6;color:#fff}
  .btn-danger{background:#ff6b6b;color:#fff}
  .btn-ghost{background:transparent;border:2px solid #0b63d6;color:#0b63d6}
</style>
</head>
<body>
  <div class="row">
    <button class="btn btn-primary">Primary</button>
    <button class="btn btn-danger">Danger</button>
    <button class="btn btn-ghost">Ghost</button>
  </div>
</body>
</html>
