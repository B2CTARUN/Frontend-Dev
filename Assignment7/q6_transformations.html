<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>CSS Transformations Showcase</title>
  <link rel="stylesheet" href="q6_transformations.css">
</head>
<body>
  <header>
    <h1>Transformations: rotate, scale, translate, skew</h1>
  </header>
  <main class="stage">
    <figure class="card rotate"><div class="box">Rotate</div><figcaption>rotate()</figcaption></figure>
    <figure class="card scale"><div class="box">Scale</div><figcaption>scale()</figcaption></figure>
    <figure class="card translate"><div class="box">Translate</div><figcaption>translate()</figcaption></figure>
    <figure class="card skew"><div class="box">Skew</div><figcaption>skew()</figcaption></figure>
  </main>
  <footer class="note">Hover each box to see the transformation (transition: all 0.4s ease).</footer>
</body>
</html>
