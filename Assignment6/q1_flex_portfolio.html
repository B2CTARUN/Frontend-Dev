<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Flexbox Portfolio</title>
  <style>
    /* Header with name left and nav right; main two columns; responsive stack below 700px */
    *{box-sizing:border-box}
    body{margin:0;font-family:Arial,Helvetica,sans-serif;display:flex;flex-direction:column;min-height:100vh}
    header{display:flex;justify-content:space-between;align-items:center;padding:1rem 2rem;background:#0b3d91;color:#fff}
    header nav a{color:#fff;text-decoration:none;margin-left:1rem}
    main{flex:1;display:flex;align-items:center;justify-content:center;padding:2rem;gap:2rem}
    .about{flex:2;background:#fff;padding:1.5rem;border-radius:8px;box-shadow:0 6px 18px rgba(0,0,0,0.06)}
    .image{flex:1;display:flex;align-items:center;justify-content:center}
    .image img{width:80%;height:auto;border-radius:8px}
    footer{text-align:center;padding:1rem;background:#f1f5f9}
    /* center items vertically and horizontally inside sections */
    .about, .image{display:flex;align-items:center;justify-content:center}

    @media (max-width:700px){
      main{flex-direction:column;padding:1rem}
      .image img{width:60%}
    }
  </style>
</head>
<body>
  <header>
    <div><strong>Tarun Chandwani</strong></div>
    <nav>
      <a href="#home">Home</a>
      <a href="#about">About</a>
      <a href="#contact">Contact</a>
    </nav>
  </header>
  <main>
    <section class="about">
      <p style="max-width:28rem;margin:0;">Hello, I'm Tarun. I work with Java, Python, Machine Learning, Web Development and Full Stack. I specialize in Deployment, DevOps and Cloud Computing.</p>
    </section>
    <aside class="image">
      <img src="https://via.placeholder.com/300" alt="Profile">
    </aside>
  </main>
  <footer>&copy; 2025 Tarun Chandwani</footer>
</body>
</html>
