<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Image Showcase</title>
<style>
  /* Grid of 6 images with hover scale and overlay; responsive stack below 700px */
  :root{--gap:12px}
  *{box-sizing:border-box}
  body{margin:0;font-family:Arial;background:#f8fafc;color:#102a43;padding:2rem}
  .gallery{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--gap);max-width:1100px;margin:0 auto}
  figure{position:relative;margin:0;border-radius:10px;overflow:hidden;background:#ddd}
  img{width:100%;height:220px;object-fit:cover;display:block;transition:transform 0.35s ease}
  figure::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,0) 40%,rgba(0,0,0,0.35));opacity:0;transition:opacity 0.35s}
  figure:hover img{transform:scale(1.1)}
  figure:hover::after{opacity:1}
  figcaption{padding:0.75rem;background:#fff;color:#102a43;text-align:center}
  @media(max-width:900px){.gallery{grid-template-columns:repeat(2,1fr)}}
  @media(max-width:700px){.gallery{grid-template-columns:1fr} img{height:200px}}
</style>
</head>
<body>
  <h1 style="text-align:center">Image Showcase</h1>
  <section class="gallery">
    <figure><img src="https://via.placeholder.com/800x600" alt="Image 1"><figcaption>Caption 1</figcaption></figure>
    <figure><img src="https://via.placeholder.com/800x600" alt="Image 2"><figcaption>Caption 2</figcaption></figure>
    <figure><img src="https://via.placeholder.com/800x600" alt="Image 3"><figcaption>Caption 3</figcaption></figure>
    <figure><img src="https://via.placeholder.com/800x600" alt="Image 4"><figcaption>Caption 4</figcaption></figure>
    <figure><img src="https://via.placeholder.com/800x600" alt="Image 5"><figcaption>Caption 5</figcaption></figure>
    <figure><img src="https://via.placeholder.com/800x600" alt="Image 6"><figcaption>Caption 6</figcaption></figure>
  </section>
</body>
</html>
