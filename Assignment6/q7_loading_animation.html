<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Loading Animation</title>
  <style>
    /* Three circles moving up and down with delays, centered via flexbox */
    body{margin:0;display:flex;height:100vh;align-items:center;justify-content:center;background:#f4f6f8}
    .loader{display:flex;gap:1rem}
    .dot{width:18px;height:18px;border-radius:50%;background:#0b63d6;animation:jump 0.8s infinite}
    .dot:nth-child(2){animation-delay:0.15s}
    .dot:nth-child(3){animation-delay:0.3s}
    @keyframes jump{0%{transform:translateY(0)}50%{transform:translateY(-16px)}100%{transform:translateY(0)}}
  </style>
</head>
<body>
  <div class="loader">
    <div class="dot"></div>
    <div class="dot"></div>
    <div class="dot"></div>
  </div>
</body>
</html>
