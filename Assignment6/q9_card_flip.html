<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Card Flip</title>
  <style>
    /* Card flip centered with flexbox, preserve-3d and perspective */
    body{margin:0;display:flex;height:100vh;align-items:center;justify-content:center;background:#f4f6f8;font-family:Arial}
    .stage{width:300px;height:200px;perspective:1000px}
    .card{width:100%;height:100%;position:relative;transform-style:preserve-3d;transition:transform 0.8s}
    .stage:hover .card{transform:rotateY(180deg)}
    .face{position:absolute;inset:0;backface-visibility:hidden;border-radius:8px;display:flex;align-items:center;justify-content:center}
    .front{background:#fff;box-shadow:0 6px 12px rgba(2,6,23,0.06)}
    .back{background:#0b3d91;color:#fff;transform:rotateY(180deg);box-shadow:0 6px 12px rgba(2,6,23,0.06)}
  </style>
</head>
<body>
  <div class="stage">
    <div class="card">
      <div class="face front"><div><h3 style="margin:0">Title</h3></div></div>
      <div class="face back"><p style="margin:0">Description on back side.</p></div>
    </div>
  </div>
</body>
</html>
