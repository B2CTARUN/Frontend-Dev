<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Q5 - Filter Cards with Animation</title>
  <style>
    *{box-sizing:border-box}
    body{font-family:Segoe UI,Arial;margin:0;background:#f7fbff;color:#071029;padding:1.25rem}
    .wrap{display:flex;gap:1rem;justify-content:center;align-items:flex-start}
    .card{width:280px;background:#fff;padding:1rem;border-radius:10px;box-shadow:0 12px 36px rgba(2,6,23,0.06);transform:translateY(0);transition:transform 220ms,filter 220ms,box-shadow 220ms;animation:fadeIn 600ms ease both}
    .card img{width:100%;height:180px;object-fit:cover;border-radius:8px;filter:grayscale(100%);transition:filter 300ms ease}
    .card:hover img{filter:none}
    .card:hover{transform:translateY(-10px);box-shadow:0 20px 46px rgba(2,6,23,0.12)}
    @keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
    @media(max-width:800px){.wrap{flex-direction:column;align-items:stretch}.card{width:100%}}
  </style>
</head>
<body>
  <main>
    <section class="wrap">
      <article class="card"><img src="https://via.placeholder.com/400x300?text=Alice" alt="Alice"><h3>Alice</h3><p>Designer</p></article>
      <article class="card"><img src="https://via.placeholder.com/400x300?text=Bob" alt="Bob"><h3>Bob</h3><p>Developer</p></article>
      <article class="card"><img src="https://via.placeholder.com/400x300?text=Carol" alt="Carol"><h3>Carol</h3><p>Product</p></article>
    </section>
  </main>
</body>
</html>
