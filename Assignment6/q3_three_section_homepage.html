<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Three Section Homepage</title>
  <style>
    /* Header (space-around), main three boxes horizontally, hover rotate, footer full width */
    body{margin:0;font-family:Arial;display:flex;flex-direction:column;min-height:100vh}
    header{background:#0b3d91;color:#fff;padding:1rem;display:flex;justify-content:space-around;align-items:center}
    header a{color:#fff;text-decoration:none}
    main{display:flex;gap:1rem;padding:2rem;justify-content:center;align-items:stretch}
    .box{flex:1;background:#fff;padding:1.5rem;border-radius:8px;text-align:center;transition:transform 0.3s;box-shadow:0 6px 12px rgba(2,6,23,0.06)}
    .box:hover{transform:rotate(2deg)}
    footer{margin-top:auto;background:#f1f5f9;padding:1rem;text-align:center}
    @media(max-width:800px){main{flex-direction:column;padding:1rem}}
  </style>
</head>
<body>
  <header>
    <a href="#">Home</a>
    <a href="#">Services</a>
    <a href="#">Projects</a>
    <a href="#">Contact</a>
  </header>
  <main>
    <section class="box">Services</section>
    <section class="box">Projects</section>
    <section class="box">Contact</section>
  </main>
  <footer>&copy; 2025 Company</footer>
</body>
</html>
