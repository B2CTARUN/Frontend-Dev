<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Grid Dashboard</title>
  <style>
    /* Grid dashboard: header spans top, sidebar left, main with boxes, one box spans 2 columns */
    body{margin:0;font-family:Arial;background:#f4f6f8}
    .grid{display:grid;grid-template-columns:250px 1fr 1fr;grid-template-rows:60px 1fr;grid-template-areas:"header header header" "sidebar main main";gap:1rem;height:100vh}
    header{grid-area:header;background:#0b3d91;color:#fff;display:flex;align-items:center;padding:0 1rem}
    aside{grid-area:sidebar;background:#12213b;color:#fff;padding:1rem}
    main{grid-area:main;padding:1rem;display:grid;grid-template-columns:1fr 1fr;grid-auto-rows:1fr;gap:1rem}
    .box{background:#fff;padding:1rem;border-radius:8px;box-shadow:0 6px 12px rgba(2,6,23,0.06);transition:transform 0.2s,box-shadow 0.2s}
    .box:hover{transform:scale(1.03);box-shadow:0 12px 24px rgba(2,6,23,0.12)}
    .span2{grid-column:1 / -1}
    @media(max-width:900px){.grid{grid-template-columns:1fr;grid-template-areas:"header" "sidebar" "main";grid-auto-rows:min-content;height:auto} main{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <div class="grid">
    <header><h1 style="font-size:1rem;margin:0">Dashboard</h1></header>
    <aside>
      <nav>
        <p>Nav</p>
        <ul style="list-style:none;padding:0;margin:0">
          <li>Overview</li>
          <li>Analytics</li>
        </ul>
      </nav>
    </aside>
    <main>
      <div class="box">Box 1</div>
      <div class="box">Box 2</div>
      <div class="box span2">Box spanning two columns</div>
      <div class="box">Box 4</div>
    </main>
  </div>
</body>
</html>
