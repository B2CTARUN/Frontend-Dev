<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Gradient Backgrounds</title>
  <link rel="stylesheet" href="q3_gradients.css">
</head>
<body>
  <header class="site-header">
    <h1>Gradient Backgrounds</h1>
  </header>

  <main>
    <section class="linear">
      <h2>Linear Gradient</h2>
      <p>This section uses a linear gradient background.</p>
    </section>

    <section class="radial">
      <h2>Radial Gradient</h2>
      <p>This section uses a radial gradient with background-attachment: fixed to create a parallax-like effect.</p>
    </section>
  </main>

  <footer class="site-footer">Gradient demo &middot; Example layout</footer>
</body>
</html>
