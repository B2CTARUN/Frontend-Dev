<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Box Model Exploration</title>
  <link rel="stylesheet" href="q8_box_model.css">
</head>
<body>
  <main class="center" aria-label="Box model demo">
    <section class="box-model">
      <div class="layer margin">
        <div class="layer border">
          <div class="layer padding">
            <div class="layer content">Content</div>
          </div>
        </div>
      </div>
      <aside class="explain">
        <h2>Box Model</h2>
        <p>Content &raquo; Padding &raquo; Border &raquo; Margin. The demo shows default box-sizing vs border-box below.</p>
      </aside>
    </section>

    <section class="compare">
      <div class="demo content-box">Default (content-box)<div class="inner">Width + padding + border add up</div></div>
      <div class="demo border-box">border-box<div class="inner">Padding & border included in width</div></div>
    </section>
  </main>
</body>
</html>
