<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Shadows & Depth</title>
  <link rel="stylesheet" href="q4_shadows_depth.css">
</head>
<body>
  <header>
    <h1>Shadows & Depth</h1>
    <p class="lead">Three cards with different box-shadow styles. Hover to lift a card.</p>
  </header>

  <main>
    <section class="cards">
      <article class="card soft">
        <h2>Soft Shadow</h2>
        <p>Subtle shadow for gentle elevation.</p>
      </article>
      <article class="card medium">
        <h2>Medium Shadow</h2>
        <p>Stronger shadow for emphasized cards.</p>
      </article>
      <article class="card strong">
        <h2>Strong Shadow</h2>
        <p>Deep shadow for hero elements.</p>
      </article>
    </section>
  </main>

  <footer>
    <p>Hover a card to see it lift with a larger shadow.</p>
  </footer>
</body>
</html>
